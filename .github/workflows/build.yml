name: Build PEAK Fabric Mod

on:
  workflow_dispatch:
  push:
    paths:
      - 'peak-mod-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract source ZIP
        run: |
          test -f peak-mod-source.zip
          mkdir -p source
          unzip -q peak-mod-source.zip -d source
          test -f source/build.gradle
          test -f source/src/main/resources/fabric.mod.json
      - name: Build mod JAR
        run: gradle -p source clean build --no-daemon
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: peak-fabric-1.21.1
          path: |
            source/build/libs/peak-survival-*.jar
            !source/build/libs/*-sources.jar
          if-no-files-found: error
